# Builds the app and publishes it to GitHub Pages on every push to main.
# One-time setup: Settings › Pages › Build and deployment › Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Docs, agent files and browser scripts don't change the app.
    paths-ignore: ['**.md', '.claude/**', 'e2e/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # Downloads CFDICT (French meanings) and copies the stroke data, then builds into dist/.
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
